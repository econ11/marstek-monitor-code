name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The release scripts' tests are Pester 3 syntax (as on the owner's PC): pin 3.4.0 in
      # Windows PowerShell, whatever newer Pester the image has.
      - name: Pester (scripts)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'3.4.0' })) {
            Install-Module Pester -RequiredVersion 3.4.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -RequiredVersion 3.4.0
          $r = Invoke-Pester scripts -PassThru
          if ($r.TotalCount -eq 0 -or $r.FailedCount -gt 0) { Write-Error "Pester: $($r.FailedCount) failed of $($r.TotalCount)"; exit 1 }

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: npm ci
        run: npm --prefix frontend ci

      # frontend/dist (embedded by main.go) and frontend/bindings are gitignored: go vet and the
      # typecheck need them, and the build itself is a check.
      - name: wails3 build
        run: wails3 build

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -tags release (core/update)
        if: runner.os == 'macOS'
        run: go test -tags release ./core/update/

      - name: npm test
        run: npm --prefix frontend test

      - name: typecheck
        run: npm --prefix frontend run typecheck
