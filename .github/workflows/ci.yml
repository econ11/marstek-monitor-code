name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: npm ci
        run: npm --prefix frontend ci

      # frontend/dist (embedded by main.go) and frontend/bindings are gitignored: go vet and the
      # typecheck need them, and the build itself is a check.
      - name: wails3 build
        run: wails3 build

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -tags release (core/update)
        if: runner.os == 'macOS'
        run: go test -tags release ./core/update/

      - name: npm test
        run: npm --prefix frontend test

      - name: typecheck
        run: npm --prefix frontend run typecheck
