name: release

# Push the tag v<x.y.z> to build Windows and macOS and create a DRAFT release in
# econ11/marstek-monitor; the owner publishes the draft by hand (docs/releasing.md).
# workflow_dispatch with dry_run=true (the default) builds and checks everything, publishes nothing.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version x.y.z (no v, no -pre or +build)'
        required: true
        type: string
      dry_run:
        description: 'Build and check only, do not create the draft release'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASES_REPO: econ11/marstek-monitor

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version (x.y.z only)
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "push" ]; then v="${REF_NAME#v}"; else v="$INPUT_VERSION"; fi
          case "$v" in
            *-*|*+*) echo "::error::version '$v' has a - or +: pre-releases and build metadata are not released"; exit 1 ;;
          esac
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be x.y.z (got '$v')"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0   # full history, so the tagged commit can be checked against origin/main

      # A draft is only ever made from main: a tag must point at a commit on main, and a real
      # (non-dry) dispatch must run on main. A dry run may run from any branch.
      - name: Released from main
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = "push" ]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::the tagged commit is not on main; tag a commit of main"; exit 1
            fi
          elif [ "$DRY_RUN" != "true" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::a non-dry release runs only on main (got $REF)"; exit 1
          fi

      - name: CHANGELOG has the version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/release-notes.ps1 -Version $env:VERSION -OutFile "$env:RUNNER_TEMP/notes.md"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      # Pinned NSIS (the version the 1.0.0 installer was built with). `choco upgrade` installs it
      # when absent and moves a preinstalled one to this exact version.
      - name: NSIS 3.13
        shell: pwsh
        run: |
          choco upgrade nsis --version=3.13.0 --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $dir = "${env:ProgramFiles(x86)}\NSIS"
          $ver = & "$dir\makensis.exe" -VERSION
          if ($ver -ne 'v3.13') { Write-Error "makensis is $ver, expected v3.13"; exit 1 }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $dir

      - name: npm ci
        run: npm --prefix frontend ci

      - name: wails3 build (bindings and frontend/dist for the checks)
        run: wails3 build

      - name: Checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Checked([string]$What, [scriptblock]$Cmd) { & $Cmd; if ($LASTEXITCODE -ne 0) { throw "$What failed (exit $LASTEXITCODE)" } }
          Invoke-Checked 'go vet' { go vet ./... }
          Invoke-Checked 'go test' { go test ./... }
          Invoke-Checked 'go test -tags release' { go test -tags release ./core/update/ }
          Invoke-Checked 'npm test' { npm --prefix frontend test }
          Invoke-Checked 'typecheck' { npm --prefix frontend run typecheck }

      # The Windows Taskfile adds the `release` build tag for any VERSION other than dev.
      - name: Installer
        shell: pwsh
        run: |
          wails3 task package "VERSION=$env:VERSION"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "bin/marstek-monitor-$env:VERSION-setup.exe")) { Write-Error 'installer not produced'; exit 1 }

      - name: The shipped exe has the release build tag
        shell: pwsh
        run: |
          $info = go version -m bin/marstek-monitor.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $info | Where-Object { $_ -match '^\s*build\s+-tags=' } | Write-Host
          if (-not ($info | Where-Object { $_ -match '^\s*build\s+-tags=(\S*,)?release(,|\s|$)' })) {
            Write-Error "bin/marstek-monitor.exe lacks the 'release' build tag"; exit 1
          }

      - name: SHA-256
        shell: pwsh
        run: |
          $name = "marstek-monitor-$env:VERSION-setup.exe"
          $hash = (Get-FileHash -LiteralPath "bin/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          # LF, no BOM: `<hex>  <name>` as sha256sum prints it (the in-app updater reads this)
          [IO.File]::WriteAllText((Join-Path $PWD "bin/$name.sha256"), "$hash  $name`n", (New-Object Text.UTF8Encoding($false)))
          Write-Host "$hash  $name"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            bin/marstek-monitor-${{ env.VERSION }}-setup.exe
            bin/marstek-monitor-${{ env.VERSION }}-setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # First, before anything else: the release never ships an unsigned or un-notarized dmg.
      - name: Signing secrets present
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          missing=""
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_KEY_ID NOTARY_ISSUER NOTARY_KEY_P8; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::missing signing secrets:$missing (see docs/releasing.md). No unsigned Mac release is built."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: npm ci
        run: npm --prefix frontend ci

      - name: wails3 build (bindings and frontend/dist for the checks)
        run: wails3 build

      - name: Checks
        run: |
          go vet ./...
          go test ./...
          go test -tags release ./core/update/
          npm --prefix frontend test
          npm --prefix frontend run typecheck

      # No `set -x` in the signing steps; nothing below prints a secret.
      - name: Temporary keychain with the Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -base64 32)"
          echo "::add-mask::$kc_pass"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain" > /dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q 'Developer ID Application'; then
            echo "::error::the certificate has no Developer ID Application identity"; exit 1
          fi

      - name: Notary API key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"

      - name: Build, sign, notarize, staple
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: NOTARY_KEY_PATH="$RUNNER_TEMP/notary-key.p8" bash scripts/macos-package.sh "$VERSION" "Developer ID Application"

      - name: Gatekeeper accepts the app
        run: |
          dmg="bin/marstek-monitor-$VERSION-macos.dmg"
          (cd bin && shasum -a 256 -c "marstek-monitor-$VERSION-macos.dmg.sha256")
          mnt="$RUNNER_TEMP/dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          trap 'hdiutil detach "$mnt" > /dev/null || true' EXIT
          app="$(find "$mnt" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app" ]; then echo "::error::no .app in $dmg"; exit 1; fi
          spctl --assess --type execute "$app"
          echo "Gatekeeper: accepted"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: |
            bin/marstek-monitor-${{ env.VERSION }}-macos.dmg
            bin/marstek-monitor-${{ env.VERSION }}-macos.dmg.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove the keychain and the key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/cert.p12"

  intel-check:
    needs: [prepare, macos]
    # An Intel runner. macos-13 (named in the plan) was retired in 2025; macos-15-intel replaces it.
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-assets
          path: dist

      - name: Both architectures, signature, Gatekeeper
        run: |
          uname -m
          dmg="dist/marstek-monitor-$VERSION-macos.dmg"
          (cd dist && shasum -a 256 -c "marstek-monitor-$VERSION-macos.dmg.sha256")
          mnt="$RUNNER_TEMP/dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          trap 'hdiutil detach "$mnt" > /dev/null || true' EXIT
          app="$(find "$mnt" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app" ]; then echo "::error::no .app in $dmg"; exit 1; fi
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          archs="$(lipo -archs "$exe")"
          echo "archs: $archs"
          case " $archs " in *" arm64 "*) ;; *) echo "::error::no arm64 slice"; exit 1 ;; esac
          case " $archs " in *" x86_64 "*) ;; *) echo "::error::no x86_64 slice"; exit 1 ;; esac
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute "$app"
          echo "Gatekeeper: accepted"

  publish:
    needs: [prepare, windows, macos, intel-check]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: The four assets
        run: |
          cd dist
          ls -l
          for f in "marstek-monitor-$VERSION-setup.exe" "marstek-monitor-$VERSION-setup.exe.sha256" \
                   "marstek-monitor-$VERSION-macos.dmg" "marstek-monitor-$VERSION-macos.dmg.sha256"; do
            if [ ! -f "$f" ]; then echo "::error::missing asset $f"; exit 1; fi
          done
          sha256sum -c "marstek-monitor-$VERSION-setup.exe.sha256" "marstek-monitor-$VERSION-macos.dmg.sha256"

      - name: Release notes
        shell: pwsh
        run: |
          ./scripts/release-notes.ps1 -Version $env:VERSION -OutFile "$env:RUNNER_TEMP/notes.md"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Draft release in the releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::missing secret RELEASES_TOKEN"; exit 1; fi
          tag="v$VERSION"
          # A published release fails the job; an old draft of the same tag is replaced.
          gone=""
          for _ in 1 2 3 4 5; do
            if ! out="$(gh release view "$tag" --repo "$RELEASES_REPO" --json isDraft --jq .isDraft 2>&1)"; then
              case "$out" in
                *"release not found"*) gone=1; break ;;
                *) echo "::error::gh release view failed: $out"; exit 1 ;;
              esac
            fi
            if [ "$out" != "true" ]; then
              echo "::error::$tag is already published in $RELEASES_REPO; nothing changed"; exit 1
            fi
            echo "deleting the existing draft $tag"
            gh release delete "$tag" --repo "$RELEASES_REPO" --yes
          done
          if [ -z "$gone" ]; then echo "::error::drafts of $tag keep appearing; check $RELEASES_REPO by hand"; exit 1; fi
          gh release create "$tag" --repo "$RELEASES_REPO" --draft --target main \
            --title "Marstek Monitor $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/marstek-monitor-$VERSION-setup.exe" "dist/marstek-monitor-$VERSION-setup.exe.sha256" \
            "dist/marstek-monitor-$VERSION-macos.dmg" "dist/marstek-monitor-$VERSION-macos.dmg.sha256"
          echo "Draft $tag created in $RELEASES_REPO. Publish it there by hand."
