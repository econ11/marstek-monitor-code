version: '3'

# macOS build. Trimmed from the Wails v3.1.0 template: no Docker
# cross-compile and no common:generate:icons (it would rebuild
# build/windows/icon.ico from appicon.png and lose the hinted small sizes;
# icons.icns is committed and was made once with
#   wails3 generate icons -input build/appicon.png -macfilename build/darwin/icons.icns -windowsfilename <throw-away>.ico).
#
# VERSION (wails3 package VERSION=1.2.3, as on Windows) stamps app.Version and
# the bundle's CFBundleShortVersionString / CFBundleVersion and adds the
# `release` build tag. Without it the build is a developer build: app.Version
# stays "dev" (never checks for updates; "0.0.0-dev" would parse as a
# version) and the bundle says 0.0.0. The dmg, signing and notarization are
# scripts/macos-package.sh.

includes:
  common: ../Taskfile.yml

vars:
  MODULE:
    sh: go list -m
  VERSION: '{{.VERSION | default "dev"}}'
  # The bundle version: VERSION, or 0.0.0 for a developer build.
  PLIST_VERSION: '{{if eq .VERSION "dev"}}0.0.0{{else}}{{.VERSION}}{{end}}'

tasks:
  build:
    summary: Builds the macOS binary for this Mac's architecture (bin/marstek-monitor)
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - task: build:go
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
          OUTPUT: '{{.OUTPUT | default (printf "%s/%s" .BIN_DIR .APP_NAME)}}'

  build:universal:
    summary: Builds one universal binary, arm64 + x86_64 (bin/marstek-monitor)
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - task: build:go
        vars: { ARCH: arm64, OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-arm64' }
      - task: build:go
        vars: { ARCH: amd64, OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-amd64' }
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-arm64" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"

  build:go:
    summary: go build for one architecture (ARCH, OUTPUT)
    internal: true
    preconditions:
      - sh: 'case "{{.VERSION}}" in ""|*[!A-Za-z0-9._+-]*) exit 1;; esac'
        msg: "VERSION may contain only letters, digits and . _ + - (got: {{.VERSION}})"
    cmds:
      # go build refuses to overwrite a file it does not take for its own
      # output, such as the universal binary lipo made.
      - rm -f "{{.OUTPUT}}"
      - go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if ne .VERSION "dev"}},release{{end}} -trimpath -buildvcs=false -ldflags="-w -s -X ''{{.MODULE}}/app.Version={{.VERSION}}''"{{end}}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  package:
    summary: Packages a universal build into bin/marstek-monitor.app (ad-hoc signed; scripts/macos-package.sh signs, notarizes and makes the dmg)
    deps:
      - task: build:universal
    cmds:
      - task: create:app:bundle

  create:app:bundle:
    summary: Creates the `.app` bundle
    cmds:
      - test -n "{{.BIN_DIR}}" && test -n "{{.APP_NAME}}" && rm -rf -- "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      - /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString {{.PLIST_VERSION}}" -c "Set :CFBundleVersion {{.PLIST_VERSION}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Info.plist"
      - for l in en uk; do mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/$l.lproj" && cp "build/darwin/$l.lproj/InfoPlist.strings" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/$l.lproj/"; done
      - task: codesign:adhoc

  codesign:adhoc:
    summary: Ad-hoc signs the app bundle (no Apple Developer account)
    internal: true
    cmds:
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - codesign --verify --deep --strict "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  run:
    summary: Runs a dev bundle with the simulated station in a throw-away data folder
    # Never the real data folder (~/Library/Application Support/MarstekMonitor)
    # and never the real station: -simulate-quiet, data in a fresh mktemp -d.
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - test -n "{{.BIN_DIR}}" && test -n "{{.APP_NAME}}" && rm -rf -- "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}" -simulate-quiet -simulate-dir "$(mktemp -d -t marstek-monitor-dev)"'
